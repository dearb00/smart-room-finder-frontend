name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # ya tumhara jo bhi default branch name ho (master/main)

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/website # Exact path point kar dia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build # Agar simple Vite/React app hai

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-platform/website/dist # Build output folder (dist or build)